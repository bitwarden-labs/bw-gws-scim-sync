name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12" # Matches the Dockerfile base image.
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt ruff==0.17.0
      - name: Ruff
        run: ruff check src tests
      - name: Unit tests (planner + SCIM client against a fake Bitwarden SCIM server)
        run: python -m unittest discover -s tests -t . -v

  shellcheck:
    name: Shellcheck setup.sh
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck setup.sh

  docker:
    name: Container build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build (same Dockerfile Cloud Build uses)
        run: docker build -t bw-gws-scim-sync:ci .
      - name: Runs as the non-root user
        run: test "$(docker run --rm --entrypoint id bw-gws-scim-sync:ci -u)" = "10001"
      - name: Starts and fails cleanly on missing config
        run: |
          out=$(docker run --rm bw-gws-scim-sync:ci 2>&1) && { echo "expected a non-zero exit"; exit 1; }
          echo "$out"
          grep -q "Missing required environment variable\|GOOGLE_GROUPS must list" <<<"$out"
